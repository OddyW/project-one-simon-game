<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Game</title>
    <link rel="stylesheet" href="./style.css">
    <script defer src="./app.js"></script>

</head>

<body>
    
    <audio id="xylo1" src="./sounds/xylophone/xylo-a.wav"></audio>
    <audio id="xylo2" src="./sounds/xylophone/xylo-d.wav"></audio>
    <audio id="xylo3" src="./sounds/xylophone/xylo-e.wav"></audio>
    <audio id="xylo4" src="./sounds/xylophone/xylo-g.wav"></audio>
    <!--  -->
    <h1>Simon game</h1>
    <h3>How to play: the tiles will play in a random sequence, press those tiles in the same order shown to you.</h3>
     <button id="muteBtn">Mute</button>
    <div class="scoreLine">
        <h4 class="score">Score: <span id="score">0</span> </h4>
        <h4 id="message">Winning/losing message here</h4>
        <h4 class="score">High Score: <span id="highScore">0</span> </h4>
        <button id="clearHighScore">Clear Highscore</button>
    </div>

    
    <div class="tiles">
        <!-- tiles -->
        <div id="redTile"></div>
        <div id="greenTile"></div>
        <div id="yellowTile"></div>
        <div id="blueTile"></div>
        <!-- middle panel -->
        <div class="middlePanel">
        <!-- <button id="restartBtn">Restart</button> -->
        
        <button id="playBtn">PLAY</button>
        <div id="round">---</div>

    </div>
    </div>

    <div id="difficulties">
        <button id="easyBtn">Easy</button>
        <button id="mediumBtn">Medium</button>
        <button id="hardBtn">Hard</button>
        <div id="setDiff">Current Difficulty: <span id="currentDiff">Easy</span></div>
    </div>



</body>

</html>
