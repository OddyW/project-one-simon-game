<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Game</title>
    <link rel="stylesheet" href="./style.css">
    <script defer src="./app.js"></script>

</head>

<body>
    <!--  -->
    <h1>Simon game</h1>
    <h3>How to play: the tiles will play in a random sequence, press those tiles in the same order shown to you.</h3>

    <div class="scoreLine">
        <h4 class="score">Your Score: </h4>
        <h4 class="score">Highest Score: </h4>
    </div>

    
    <div class="tiles">
        <!-- tiles -->
        <div id="redTile"></div>
        <div id="greenTile"></div>
        <div id="yellowTile"></div>
        <div id="blueTile"></div>
        <!-- middle panel -->
        <div class="middlePanel">
        <button id="playBtn">PLAY</button>
        <div id="round">---</div>
    </div>
    </div>


</body>

</html>
